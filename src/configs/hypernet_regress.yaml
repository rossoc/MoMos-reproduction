defaults:
  - model: mamba
  - dataset: cifar10
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

seed: 42
epochs: 50
batch_size: 128
accelerator: auto
devices: 1
data_dir: ./data
log_dir: ./outputs
prefix: "hypernet_regress"

# Per-position output grid of the hypernet (each (layer, row, col) embedding
# produces `rows * cols` raw weight values).
rows: 4
cols: 8

patience: null
periodic_checkpoint: null
metrics: []
all_compression_metrics_binarized: false
quantization:
  enabled: false

wandb:
  enabled: false
  project: momos-hypernet-regress
  entity: null
  name: null
  tags: []
  log_model: false

hydra:
  output_subdir: null
  run:
    dir: ./outputs
  sweep:
    dir: ./outputs
    subdir: ${hydra.job.name}
