defaults:
  - dataset: cifar10
  - model: mlp
  - quantization: none
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# Training overrides
epochs: 200
patience: null
seed: 42
fold: null  # set to 0-(n_folds-1) to activate k-fold cross-validation

# Data
data_dir: ./data
batch_size: 128

# Trainer
accelerator: auto
devices: 1

# Logging
log_dir: ./outputs
prefix: ""

periodic_checkpoint: null

# Hydra output configuration
hydra:
  output_subdir: null
  run:
    dir: ./outputs
  sweep:
    dir: ./outputs
    subdir: ${hydra.job.name}

# Weights & Biases
wandb:
  enabled: true
  project: momos-reproduction
  entity: null
  name: null
  tags: []
  log_model: true

# Metrics
metrics: []  # e.g., [sparsity, l2, gzip, bz2, lzma, bdm]
all_compression_metrics_binarized: false
