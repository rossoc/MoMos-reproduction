defaults:
  - hypernet
  - _self_

prefix: "tune_hypernet"

tune:
  study_name: hypernet_tpe_v1
  n_trials: 50
  trial_epochs: 100
  storage_dir: ${log_dir}/optuna
  direction: maximize
  monitor: val/acc
  pruner:
    n_startup_trials: 5
    n_warmup_steps: 3
  sampler:
    seed: ${seed}
  wandb_per_trial: false
  search_space:
    learning_rate: {low: 1.0e-5, high: 1.0e-2, log: true}
    weight_decay: {low: 1.0e-5, high: 1.0e-1, log: true}
    hidden_size: [16, 32, 64, 128]
    num_heads: [4, 8, 16]
    num_hidden_layers: {low: 1, high: 4}
    state_size: [8, 16, 32, 64]
    n_groups: [1, 2, 4, 8]
