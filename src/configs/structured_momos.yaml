defaults:
  - model: mamba
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

seed: 42
epochs: 50
accelerator: auto
devices: 1
data_dir: ./data
log_dir: ./outputs
prefix: "structured_momos"

# Source checkpoint of the MoMos-quantized MLP. Only used to extract the motif
# library and per-layer geometry — the hypernet is then trained from scratch
# against the *task* (no mask supervision).
checkpoint_path: ???

# Hypernet output grid (must match what the source MLP was quantized with).
rows: 4
cols: 8
motif_rows: 1
motif_cols: 2

output_layers: 2
# Memory knobs (tune down if you OOM on the largest MLP layer):
#   motif_chunk_size: motifs processed in one Mamba call (linear in mem).
#   mamba_chunk_size: SSD chunk inside Mamba2 (quadratic in mem; default 256).
motif_chunk_size: 4
mamba_chunk_size: 64

# Hypernet update cadence. The hypernet weights are recomputed and updated
# once every `hypernet_update_every` task batches: within a macro-batch the
# generated MLP weights are frozen and only the (cheap) target-MLP graph is
# walked per step; at the boundary a single chunked hypernet backward
# consumes the upstream gradient accumulated over the macro-batch.
# Set to 1 to update per step (original behaviour, but slow).
hypernet_update_every: 32

# Image task data (CIFAR-10-shaped by default).
task_dataset:
  name: cifar10
  num_classes: 10
  in_channels: 3
  img_size: 32
  batch_size: 128
  val_pct: 0.05
  test_pct: 1.0
  n_folds: 5
  kfold_seed: 10
  fold: 0

# Softmax temperature schedule (annealed across epochs). Forward W is a soft
# convex combination of motifs: W = softmax(logits/tau) @ M. Lower tau peaks
# the mix toward a single motif per position.
gumbel:
  tau_start: 1.0
  tau_end: 0.1

regularization:
  entropy_weight_start: 0.0
  entropy_weight_end: 1.0e-2
  load_balance_weight: 1.0e-3

grad_clip: 1.0

patience: null
periodic_checkpoint: null
metrics: []
all_compression_metrics_binarized: false
quantization:
  enabled: false

wandb:
  enabled: false
  project: momos-structured
  entity: null
  name: null
  tags: []
  log_model: false

hydra:
  output_subdir: null
  run:
    dir: ./outputs
  sweep:
    dir: ./outputs
    subdir: ${hydra.job.name}
