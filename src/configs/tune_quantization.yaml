defaults:
  - dataset: cifar10
  - model: mlp
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

epochs: 100
seed: 42
fold: null
data_dir: ./data
batch_size: 128
accelerator: auto
devices: 1
precision: null

log_dir: ./outputs
prefix: tune_quantization

evaluate_test: false
save_init_ckpt: false

# Default quantization placeholder
quantization:
  enabled: true
  method: none

# Weights & Biases configuration
wandb:
  enabled: true
  project: mlp-paretofront3
  entity: null
  name: null
  group: ${optuna.study_name}
  tags: [optuna, quantization-search]
  log_model: false

# Optuna configuration
optuna:
  study_name: mlp_paretofront3
  storage_dir: ./outputs/optuna
  n_trials: 30
  eval_folds_search: [0]  # Fold(s) to evaluate during trial search
  pareto_kfold_eval: true # If true, re-evaluate Pareto-best configs on all K folds
  pareto_seeds: [85, 28, 57] # Random seeds for Pareto-best verification
  
  sampler:
    seed: 42

  # Pareto feasibility floor: trials with mean val_acc below this are marked
  # infeasible and excluded from the front (drops ~random-guess points).
  min_val_accuracy: 0.20

  reuse_completed_trials: true

  # Quantization methods to include in the Optuna search
  methods:
    - momos2d
    # - qat
    - hierarchical_momos2d

  search_space:
    momos2d:
      rows: [1, 2, 4]
      cols: [1, 2, 4]
      capacity:
        low: 0.00001
        high: 0.001
        log: true

    qat:
      q: [32]

    hierarchical_momos2d:
      switch_fraction: 0.0
      primary:
        rows: [1, 2]
        cols: [1, 2]
        capacity:
          low: 0.00001
          high: 0.001
          log: true
      secondary:
        rows: [4, 8, 16, 32, 64]
        cols: [4, 8, 16, 32, 64]
        capacity:
          low: 0.0001
          high: 0.5
          log: true
